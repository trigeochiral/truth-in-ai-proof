[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "truth-in-ai-verify"
version = "1.0.0"
description = "verifier for TriGeoChiral Truth-in-AI signed benchmark results (Ed25519 + OpenTimestamps)"
readme = "README.md"
license = {text = "Proprietary — see LICENSE, contact for interest"}
requires-python = ">=3.9"
authors = [
  {name = "David Zubick", email = "trigeochiral@gmail.com"},
  {name = "Jennifer Huff"},
]
maintainers = [
  {name = "TriGeoChiral Engineering", email = "trigeochiral@gmail.com"},
]
keywords = ["ai-detection", "trevs", "opentimestamps", "ed25519", "audit", "reproducible", "trigeochiral"]
classifiers = [
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Legal Industry",
  "Topic :: Scientific/Engineering",
  "Topic :: Security :: Cryptography",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "cryptography>=41",
]

[project.urls]
Homepage      = "https://github.com/trigeochiral/truth-in-ai-proof"
Repository    = "https://github.com/trigeochiral/truth-in-ai-proof"
Documentation = "https://github.com/trigeochiral/truth-in-ai-proof/blob/main/README.md"
Issues        = "https://github.com/trigeochiral/truth-in-ai-proof/issues"
"Priority Anchor" = "https://opentimestamps.org"

[project.scripts]
truth-in-ai-verify = "truth_in_ai_verify.cli:main"

[tool.setuptools.packages.find]
include = ["truth_in_ai_verify*"]
